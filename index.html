<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Humaaans: Mix-&-Match illustration library</title>
        <link rel="icon" type="imagen/icon" href="./src/assets/icons/5c00a0ce59aa851331d34687_favicon-256.png" />
        <link rel="stylesheet" href="./src/css/style.css" />
    </head>
    <body>
        <section class="banner">
            <p class="banner__description">Discover curated, free images for your projects!</p>
            <button class="banner__btn">Explore Lummi</button>
            <p class="banner__btn-close">×</p>
        </section>
        <section class="hero">
            <div class="hero__images">
                <img src="./src/assets/img/hero-4.svg" alt="persona caminando con chaqueta" class="hero__image--4" />
                <img src="./src/assets/img/hero-1.svg" alt="persona caminando" class="hero__image--1" />
                <img src="./src/assets/img/hero-3.svg" alt="persona caminando" class="hero__image--3" />
                <img src="./src/assets/img/hero-2.svg" alt="persona caminando" class="hero__image--2" />
            </div>
            <div class="hero__content">
                <h1 class="hero__heading">humaaans</h1>
                <h3 class="hero__subheading">Mix-&-match illustrations of people with a design library</h3>
                <div class="hero__buttons">
                    <button class="hero__btn hero__btn--primary">Use with Blush</button>
                    <button class="hero__btn hero__btn--secundary">Download</button>
                </div>
                <div class="hero__label">
                    <img src="./src/assets/img/logo-creative.webp" alt="logo creative" />
                    <p>
                        CC0 Free for commercial or personal use by
                        <a href="https://x.com/pablostanley" target="_blank">Pablo Stanley</a>
                    </p>
                </div>
            </div>
        </section>
    </body>
</html>
