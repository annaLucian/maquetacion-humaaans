<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Humaaans: Mix-&-Match illustration library</title>
        <link rel="icon" type="imagen/icon" href="./src/assets/icons/5c00a0ce59aa851331d34687_favicon-256.png" />
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <section class="banner">
            <p class="banner_description">Discover curated, free images for your projects!</p>
            <button class="banner_btn">Explore Lummi</button>
            <p class="banner_close">×</p>
        </section>
        <section class="hero-section">
            <div class="hero-images">
                <img src="./src/assets/img/hero-4.svg" alt="persona caminando con chaqueta" class="hero-image_4" />
                <img src="./src/assets/img/hero-1.svg" alt="persona caminando" class="hero-image_1" />
                <img src="./src/assets/img/hero-3.svg" alt="persona caminando" class="hero-image_3" />
                <img src="./src/assets/img/hero-2.svg" alt="persona caminando" class="hero-image_2" />
            </div>
            <div class="hero-content">
                <h1 class="hero-heading">humaaans</h1>
                <h3 class="hero-subheading">Mix-&-match illustrations of people with a design library</h3>
                <div class="hero-buttons">
                    <button class="hero-btn hero-btn--primary">Use with Blush</button>
                    <button class="hero-btn hero-btn--secundary">Download</button>
                </div>
                <div class="hero-label">
                    <img src="./src/assets/img/logo-creative.webp" alt="logo creative" />
                    <p>CC0 Free for commercial or personal use by</p>
                    <a href="https://x.com/pablostanley" target="_blank">Pablo Stanley</a>
                </div>
            </div>
        </section>
    </body>
</html>
